<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>手势烟花</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            overflow: hidden;
            background: #000;
        }
        
        #canvas {
            display: block;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1;
        }
        
        #video {
            display: none;
        }
        
        #loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 24px;
            z-index: 100;
            text-align: center;
        }
        
        #loading.hidden {
            display: none;
        }
        
        #videoPreview {
            position: fixed;
            top: 20px;
            left: 20px;
            width: 240px;
            height: 180px;
            border: 3px solid rgba(255, 255, 255, 0.5);
            border-radius: 10px;
            z-index: 50;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
        }
        
        #videoPreview canvas {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>
<body>
    <div id="loading">正在加载摄像头和手势识别...</div>
    <video id="video" autoplay playsinline></video>
    <div id="videoPreview">
        <canvas id="previewCanvas"></canvas>
    </div>
    <canvas id="canvas"></canvas>
    
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const video = document.getElementById('video');
        const loading = document.getElementById('loading');
        const previewCanvas = document.getElementById('previewCanvas');
        const previewCtx = previewCanvas.getContext('2d');
        
        let width, height;
        let particles = [];
        let fireworks = [];
        let handPosition = null;
        let isFist = false;
        let showText = false;
        let textAlpha = 0;
        
        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }
        
        resize();
        window.addEventListener('resize', resize);
        
        class Particle {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.originX = x;
                this.originY = y;
                this.vx = 0;
                this.vy = 0;
                this.radius = Math.random() * 3 + 2;
                this.color = `hsl(${Math.random() * 360}, 70%, 60%)`;
                this.alpha = 1;
                this.following = false;
            }
            
            update(targetX, targetY) {
                if (this.following && targetX !== null && targetY !== null) {
                    const dx = targetX - this.x;
                    const dy = targetY - this.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    
                    if (dist > 5) {
                        this.vx += dx * 0.02;
                        this.vy += dy * 0.02;
                    }
                } else {
                    const dx = this.originX - this.x;
                    const dy = this.originY - this.y;
                    this.vx += dx * 0.01;
                    this.vy += dy * 0.01;
                }
                
                this.vx *= 0.95;
                this.vy *= 0.95;
                
                this.x += this.vx;
                this.y += this.vy;
            }
            
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.globalAlpha = this.alpha;
                ctx.fill();
                ctx.globalAlpha = 1;
            }
        }
        
        class FireworkParticle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 10 + 5;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                this.radius = Math.random() * 3 + 1;
                this.color = color;
                this.alpha = 1;
                this.gravity = 0.1;
            }
            
            update() {
                this.vy += this.gravity;
                this.x += this.vx;
                this.y += this.vy;
                this.vx *= 0.98;
                this.vy *= 0.98;
                this.alpha -= 0.015;
            }
            
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.globalAlpha = this.alpha;
                ctx.fill();
                ctx.globalAlpha = 1;
            }
        }
        
        function createParticles() {
            const count = 100;
            for (let i = 0; i < count; i++) {
                const x = Math.random() * width;
                const y = Math.random() * height;
                particles.push(new Particle(x, y));
            }
        }
        
        function createFirework(x, y) {
            const color = `hsl(${Math.random() * 360}, 80%, 60%)`;
            for (let i = 0; i < 50; i++) {
                fireworks.push(new FireworkParticle(x, y, color));
            }
        }
        
        function checkFist(landmarks) {
            const thumbTip = landmarks[4];
            const indexTip = landmarks[8];
            const middleTip = landmarks[12];
            const ringTip = landmarks[16];
            const pinkyTip = landmarks[20];
            
            const indexPip = landmarks[6];
            const middlePip = landmarks[10];
            const ringPip = landmarks[14];
            const pinkyPip = landmarks[18];
            
            const indexFolded = indexTip.y > indexPip.y;
            const middleFolded = middleTip.y > middlePip.y;
            const ringFolded = ringTip.y > ringPip.y;
            const pinkyFolded = pinkyTip.y > pinkyPip.y;
            
            return indexFolded && middleFolded && ringFolded && pinkyFolded;
        }
        
        function onResults(results) {
            loading.classList.add('hidden');
            
            previewCanvas.width = 240;
            previewCanvas.height = 180;
            previewCtx.save();
            previewCtx.translate(240, 0);
            previewCtx.scale(-1, 1);
            previewCtx.drawImage(video, 0, 0, 240, 180);
            previewCtx.restore();
            
            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const landmarks = results.multiHandLandmarks[0];
                const palm = landmarks[9];
                
                handPosition = {
                    x: palm.x * width,
                    y: palm.y * height
                };
                
                const newIsFist = checkFist(landmarks);
                
                // 检测到手掌时让粒子开始跟随
                particles.forEach(p => {
                    p.following = true;
                });
                
                if (newIsFist && !isFist) {
                    showText = true;
                    textAlpha = 0;
                    
                    particles.forEach(p => {
                        p.vx = (Math.random() - 0.5) * 5;
                        p.vy = -Math.random() * 10 - 5;
                    });
                    
                    setTimeout(() => {
                        particles.forEach(p => {
                            createFirework(p.x, p.y);
                        });
                        particles = [];
                    }, 500);
                }
                
                isFist = newIsFist;
            } else {
                handPosition = null;
                particles.forEach(p => p.following = false);
                isFist = false;
            }
        }
        
        const hands = new Hands({
            locateFile: (file) => {
                return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
            }
        });
        
        hands.setOptions({
            maxNumHands: 1,
            modelComplexity: 1,
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
        });
        
        hands.onResults(onResults);
        
        async function startCamera() {
            try {
                loading.textContent = '正在请求摄像头权限...';
                
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { 
                        width: { ideal: 640, max: 1280 },
                        height: { ideal: 480, max: 720 },
                        facingMode: 'user',
                        frameRate: { ideal: 30, max: 60 }
                    }
                });
                
                loading.textContent = '正在初始化摄像头...';
                video.srcObject = stream;
                
                await new Promise((resolve) => {
                    video.onloadedmetadata = () => {
                        resolve();
                    };
                });
                
                await video.play();
                
                loading.classList.add('hidden');
                
                async function processFrame() {
                    await hands.send({ image: video });
                    requestAnimationFrame(processFrame);
                }
                
                processFrame();
            } catch (error) {
                if (error.name === 'NotAllowedError') {
                    loading.textContent = '摄像头权限被拒绝，请在浏览器设置中允许摄像头访问';
                } else if (error.name === 'NotFoundError') {
                    loading.textContent = '未找到可用的摄像头设备';
                } else if (error.name === 'NotReadableError' || error.message.includes('Could not start video source')) {
                    loading.textContent = '摄像头被其他应用占用，请关闭其他使用摄像头的程序';
                } else {
                    loading.textContent = '无法访问摄像头，请确保已授予权限';
                }
                console.error('摄像头错误:', error);
            }
        }
        
        function drawText() {
            if (!showText) return;
            
            textAlpha = Math.min(textAlpha + 0.02, 1);
            
            ctx.save();
            ctx.globalAlpha = textAlpha;
            ctx.font = 'bold 80px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            
            const gradient = ctx.createLinearGradient(0, 0, width, 0);
            gradient.addColorStop(0, '#ff6b6b');
            gradient.addColorStop(0.2, '#feca57');
            gradient.addColorStop(0.4, '#48dbfb');
            gradient.addColorStop(0.6, '#ff9ff3');
            gradient.addColorStop(0.8, '#54a0ff');
            gradient.addColorStop(1, '#5f27cd');
            
            ctx.fillStyle = gradient;
            ctx.shadowColor = 'rgba(255, 255, 255, 0.8)';
            ctx.shadowBlur = 20;
            ctx.fillText('新年快乐', width / 2, height / 2);
            ctx.restore();
        }
        
        function animate() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
            ctx.fillRect(0, 0, width, height);
            
            const targetX = handPosition ? handPosition.x : null;
            const targetY = handPosition ? handPosition.y : null;
            
            particles.forEach(p => {
                p.update(targetX, targetY);
                p.draw();
            });
            
            fireworks = fireworks.filter(f => f.alpha > 0);
            fireworks.forEach(f => {
                f.update();
                f.draw();
            });
            
            drawText();
            
            requestAnimationFrame(animate);
        }
        
        createParticles();
        startCamera();
        animate();
    </script>
</body>
</html>
